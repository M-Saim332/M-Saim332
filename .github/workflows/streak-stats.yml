name: Generate Streak Stats
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats SVG
        run: |
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors \
            "https://streak-stats.demolab.com/?user=M-Saim332&theme=tokyonight&hide_border=true&background=0D1117&ring=58A6FF&fire=FF6B6B&currStreakLabel=58A6FF&timezone=Asia/Karachi" \
            -o streak-stats-new.svg

      - name: Validate output is a real SVG
        run: |
          if ! grep -q "<svg" streak-stats-new.svg; then
            echo "Fetched file is not a valid SVG (service likely down). Aborting update."
            exit 1
          fi
          mv streak-stats-new.svg streak-stats.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
