name: Generate Streak Stats
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@master
        with:
          user_id: M-Saim332
          theme: tokyonight
          hide_border: true
          background: 0D1117
          ring: 58A6FF
          fire: FF6B6B
          currStreakLabel: 58A6FF
          timezone: Asia/Karachi
          date_format: "M j[S]"
          type: svg
          exclude_days: ""

      - name: Save output
        run: |
          find . -name "*.svg" -newer .git -maxdepth 1 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
